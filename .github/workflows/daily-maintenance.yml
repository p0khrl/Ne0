name: Daily Ne0 Maintenance

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python syntax check
        run: |
          python -m compileall main.py scanner utils

      - name: Update maintenance record
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("CHANGELOG.md")
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          entry = f"- {today}: Automated maintenance check completed.\n"

          old = path.read_text(encoding="utf-8") if path.exists() else "# Changelog\n\n"

          if entry not in old:
              path.write_text(old + entry, encoding="utf-8")
          PY

      - name: Commit maintenance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
          else
            git commit -m "chore: daily maintenance update"
            git push
          fi